[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "native-illustration-compiler"
version = "0.1.0"
description = "Deterministic IR-to-Krita document compiler for editable .kra output."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

